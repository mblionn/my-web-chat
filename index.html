<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web TV 555 - Live Random Video Chat</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation */
    header {
      height: 56px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-badge {
      background: #2563eb;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }

    .online-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .online-dot {
      width: 7px;
      height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--success);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-select {
      background: #1f2937;
      color: #fff;
      border: 1px solid #374151;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }

    .cam-btn {
      background: var(--success);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .cam-btn:hover {
      opacity: 0.9;
    }

    /* Main Container */
    main {
      flex: 1;
      display: flex;
      padding: 12px;
      gap: 12px;
      overflow: hidden;
    }

    /* Video Section */
    .video-section {
      flex: 7;
      display: flex;
      gap: 12px;
      height: 100%;
    }

    .video-card {
      flex: 1;
      background: #000;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
    }

    .badge-dot.connected {
      background: var(--success);
    }

    .video-match-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      z-index: 10;
      display: none;
    }

    /* Video & Canvas Elements */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.3s ease;
    }

    .mirrored {
      transform: scaleX(-1);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Floating Media Controls */
    .media-floating-controls {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 5px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .media-floating-controls button {
      background: none;
      border: none;
      color: #fff;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 0.82rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .media-floating-controls button:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Chat Section */
    .chat-section {
      flex: 3;
      min-width: 300px;
      max-width: 400px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    .chat-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .messages-container {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      font-size: 0.86rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message .time {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-right: 5px;
    }

    .message.stranger .sender {
      color: var(--danger);
      font-weight: 700;
    }

    .message.you .sender {
      color: var(--primary);
      font-weight: 700;
    }

    .message.system {
      color: var(--text-muted);
      font-style: italic;
      font-size: 0.8rem;
      text-align: center;
      margin: 4px 0;
    }

    /* Quick Reply Chips */
    .quick-replies {
      padding: 6px 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 6px;
      background: #0e1524;
      overflow-x: auto;
      align-items: center;
    }

    .quick-chip-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 2px;
      flex-shrink: 0;
    }

    .quick-chip {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .quick-chip:hover {
      background: #334155;
      color: #fff;
    }

    .chat-input-area {
      padding: 10px 14px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: var(--primary);
    }

    .chat-input-area button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .chat-input-area button:hover {
      background: var(--primary-hover);
    }

    /* Bottom Control Bar */
    footer {
      height: 62px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      flex-shrink: 0;
    }

    .btn-main-action {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-main-action.stop {
      background: var(--danger);
    }

    .btn-main-action.stop:hover {
      background: var(--danger-hover);
    }

    .btn-main-action:hover {
      background: var(--primary-hover);
    }

    .interests-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tag-badge {
      background: #1e3a8a;
      color: #93c5fd;
      font-size: 0.74rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-text {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    @media (max-width: 900px) {
      main {
        flex-direction: column;
      }
      .video-section {
        flex: 1;
      }
      .chat-section {
        max-width: none;
        flex: 1;
      }
      .status-text {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="logo">
        Web TV <span class="logo-badge">555</span>
      </div>
      <div class="online-counter">
        <span class="online-dot"></span>
        <span id="userCount">42,810</span> online
      </div>
    </div>
    <div class="header-actions">
      <!-- Live Video Filters -->
      <select id="filterSelect" class="filter-select" title="Camera Filter">
        <option value="none">✨ Filter: Normal</option>
        <option value="grayscale(100%)">Noir (B&W)</option>
        <option value="sepia(60%) contrast(110%)">Warm Vintage</option>
        <option value="hue-rotate(180deg) saturate(180%)">Cyberpunk</option>
        <option value="brightness(110%) contrast(120%)">Soft Glow</option>
        <option value="invert(100%)">Invert</option>
      </select>
      <button class="cam-btn" id="btnToggleHardware">📹 Enable Camera & Mic</button>
    </div>
  </header>

  <!-- Video & Chat Layout -->
  <main>
    <div class="video-section">
      <!-- Stranger Video / Simulated Partner -->
      <div class="video-card">
        <div class="video-badge">
          <span class="badge-dot" id="strangerDot"></span>
          <span id="strangerLabel">Disconnected</span>
        </div>
        <div class="video-match-tag" id="strangerTag">Matched on: #music</div>
        <canvas id="strangerCanvas"></canvas>
      </div>

      <!-- Local User Video / Avatar -->
      <div class="video-card">
        <div class="video-badge">
          <span class="badge-dot" id="localDot"></span>
          <span id="localLabel">You (Avatar Mode)</span>
        </div>
        <video id="localVideo" class="mirrored" autoplay playsinline muted style="display: none;"></video>
        <canvas id="localCanvas"></canvas>

        <!-- Media Controls (Includes Mirror Toggle) -->
        <div class="media-floating-controls" id="floatingControls" style="display: none;">
          <button id="btnToggleMirror" title="Flip Mirror">🪞 Mirror (On)</button>
          <button id="btnMuteAudio" title="Mute Mic">🎤 Mute</button>
          <button id="btnMuteVideo" title="Stop Video">📷 Cam</button>
        </div>
      </div>
    </div>

    <!-- Right Side Chat Box -->
    <div class="chat-section">
      <div class="chat-header">
        <span>💬 Text Chat</span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Encrypted P2P</span>
      </div>

      <div class="messages-container" id="chatContainer">
        <div class="message system">Welcome to Web TV 555! Click Start Chat to connect with a random stranger.</div>
      </div>

      <!-- Quick Reply Chips -->
      <div class="quick-replies">
        <span class="quick-chip-label">Quick:</span>
        <button class="quick-chip" data-msg="Hey!">👋 Hey</button>
        <button class="quick-chip" data-msg="ASL?">📍 ASL?</button>
        <button class="quick-chip" data-msg="What are your hobbies?">🎮 Hobbies</button>
        <button class="quick-chip" data-msg="Nice meeting you!">😄 Nice</button>
      </div>

      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." disabled autocomplete="off" />
        <button id="btnSendMessage" disabled>Send</button>
      </div>
    </div>
  </main>

  <!-- Footer Controls -->
  <footer>
    <button class="btn-main-action" id="btnMainAction">▶ Start Chat</button>

    <div class="interests-box">
      <span class="tag-badge">#chatting</span>
      <span class="tag-badge">#music</span>
    </div>

    <span class="status-text" id="statusHelp">Press <b>Esc</b> to skip stranger</span>
  </footer>

  <script>
    // --- State Variables ---
    let isConnected = false;
    let isSearching = false;
    let localStream = null;
    let isMirrored = true;
    let micMuted = false;
    let camDisabled = false;
    let partnerAnimationTimer = null;
    let botDialogueTimeout = null;

    // --- Sound Effects Synthesizer ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(frequency, duration) {
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- Stranger Simulation Profiles ---
    const strangerProfiles = [
      { name: "Sofia (Spain)", skin: "#f6d5b8", hair: "#1c1917", shirt: "#ef4444", tag: "#music" },
      { name: "Alex (Canada)", skin: "#fbd3b2", hair: "#3e2723", shirt: "#3b82f6", tag: "#gaming" },
      { name: "Kenji (Japan)", skin: "#f4cca4", hair: "#111827", shirt: "#10b981", tag: "#music" },
      { name: "Maya (Brazil)", skin: "#c68642", hair: "#1e1b18", shirt: "#8b5cf6", tag: "#art" }
    ];
    let currentStranger = null;

    // --- DOM Elements ---
    const filterSelect = document.getElementById("filterSelect");
    const btnToggleHardware = document.getElementById("btnToggleHardware");
    const localVideo = document.getElementById("localVideo");
    const localCanvas = document.getElementById("localCanvas");
    const strangerCanvas = document.getElementById("strangerCanvas");
    const localDot = document.getElementById("localDot");
    const localLabel = document.getElementById("localLabel");
    const strangerDot = document.getElementById("strangerDot");
    const strangerLabel = document.getElementById("strangerLabel");
    const strangerTag = document.getElementById("strangerTag");
    const btnMainAction = document.getElementById("btnMainAction");
    const chatContainer = document.getElementById("chatContainer");
    const chatInput = document.getElementById("chatInput");
    const btnSendMessage = document.getElementById("btnSendMessage");
    const floatingControls = document.getElementById("floatingControls");
    const btnToggleMirror = document.getElementById("btnToggleMirror");
    const btnMuteAudio = document.getElementById("btnMuteAudio");
    const btnMuteVideo = document.getElementById("btnMuteVideo");
    const quickChips = document.querySelectorAll(".quick-chip");

    // --- 1. Canvas Dimensions & Resizing ---
    function syncCanvasSizes() {
      [localCanvas, strangerCanvas].forEach(c => {
        if (!c) return;
        const rect = c.getBoundingClientRect();
        if (c.width !== rect.width || c.height !== rect.height) {
          c.width = rect.width;
          c.height = rect.height;
        }
      });
    }
    window.addEventListener("resize", syncCanvasSizes);
    setTimeout(syncCanvasSizes, 100);

    // --- 2. Fallback Neutral Avatar (Local) ---
    function drawNeutralAvatar(canvas, ctx) {
      if (!canvas || !ctx) return;
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0c1322";
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h * 0.44;
      const headRadius = Math.min(w, h) * 0.18;

      // Head
      ctx.fillStyle = "#3b82f6";
      ctx.beginPath();
      ctx.arc(cx, cy, headRadius, 0, Math.PI * 2);
      ctx.fill();

      // Torso / Shoulders
      ctx.beginPath();
      const shoulderRadius = Math.min(w, h) * 0.38;
      ctx.arc(cx, h + (shoulderRadius * 0.45), shoulderRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // --- 3. Perfectly Proportioned Stranger Avatar ---
    let frameStep = 0;
    function renderStrangerFrame() {
      if (!strangerCanvas) return;
      const ctx = strangerCanvas.getContext("2d");
      const w = strangerCanvas.width;
      const h = strangerCanvas.height;

      ctx.clearRect(0, 0, w, h);

      if (!isConnected || !currentStranger) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, w, h);
        return;
      }

      frameStep += 0.04;
      const breath = Math.sin(frameStep) * 2;

      // Card Background
      ctx.fillStyle = "#0c1322";
      ctx.fillRect(0, 0, w, h);

      const cx = w / 2;
      const headRadius = Math.min(w, h) * 0.19; 
      const cy = h * 0.38 + breath; // Placed at upper-center

      // 1. Shoulders / Chest (Broad, natural curve anchored to bottom)
      ctx.fillStyle = currentStranger.shirt;
      ctx.beginPath();
      ctx.ellipse(cx, h * 0.95 + breath, w * 0.42, h * 0.38, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Neck
      ctx.fillStyle = currentStranger.skin;
      const neckWidth = headRadius * 0.48;
      const neckHeight = headRadius * 0.55;
      ctx.fillRect(cx - (neckWidth / 2), cy + (headRadius * 0.65), neckWidth, neckHeight);

      // 3. Head (Full circle)
      ctx.beginPath();
      ctx.arc(cx, cy, headRadius, 0, Math.PI * 2);
      ctx.fill();

      // 4. Hair (Neat rounded cap)
      ctx.fillStyle = currentStranger.hair;
      ctx.beginPath();
      ctx.arc(cx, cy - (headRadius * 0.05), headRadius * 1.02, Math.PI, Math.PI * 2);
      ctx.fill();

      // 5. Eyes (Blinking animation)
      ctx.fillStyle = "#111827";
      const eyeOffset = headRadius * 0.36;
      const isBlinking = Math.sin(frameStep * 0.5) > 0.96;
      
      if (isBlinking) {
        ctx.fillRect(cx - eyeOffset - 4, cy - 1, 8, 2);
        ctx.fillRect(cx + eyeOffset - 4, cy - 1, 8, 2);
      } else {
        ctx.beginPath();
        ctx.arc(cx - eyeOffset, cy, headRadius * 0.07, 0, Math.PI * 2);
        ctx.arc(cx + eyeOffset, cy, headRadius * 0.07, 0, Math.PI * 2);
        ctx.fill();
      }

      // 6. Smile
      ctx.strokeStyle = "#4b2d18";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx, cy + (headRadius * 0.18), headRadius * 0.28, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      partnerAnimationTimer = requestAnimationFrame(renderStrangerFrame);
    }

    // Initialize local neutral canvas
    function initLocalAvatar() {
      syncCanvasSizes();
      const ctx = localCanvas.getContext("2d");
      drawNeutralAvatar(localCanvas, ctx);
    }
    initLocalAvatar();

    // --- 4. Camera, Mic, Mirror, and Filter Features ---
    async function startHardwareCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        localStream = stream;
        localVideo.srcObject = stream;
        localVideo.style.display = "block";
        localCanvas.style.display = "none";
        floatingControls.style.display = "flex";

        localDot.classList.add("connected");
        localLabel.textContent = "You (Live WebCam)";
        btnToggleHardware.style.background = "#2563eb";
        btnToggleHardware.textContent = "✔ Camera Active";
      } catch (err) {
        console.warn("Hardware camera failed or denied:", err);
        alert("Camera/Mic access was denied or no device was detected. Avatar fallback remains active.");
      }
    }
    btnToggleHardware.addEventListener("click", startHardwareCamera);

    // Mirror Toggle
    btnToggleMirror.addEventListener("click", () => {
      isMirrored = !isMirrored;
      if (isMirrored) {
        localVideo.classList.add("mirrored");
        btnToggleMirror.textContent = "🪞 Mirror (On)";
      } else {
        localVideo.classList.remove("mirrored");
        btnToggleMirror.textContent = "🪞 Mirror (Off)";
      }
    });

    // Filter Change
    filterSelect.addEventListener("change", (e) => {
      const selectedFilter = e.target.value;
      localVideo.style.filter = selectedFilter === "none" ? "none" : selectedFilter;
    });

    // Mute Toggles
    btnMuteAudio.addEventListener("click", () => {
      if (!localStream) return;
      micMuted = !micMuted;
      localStream.getAudioTracks().forEach(t => (t.enabled = !micMuted));
      btnMuteAudio.textContent = micMuted ? "🔇 Unmute" : "🎤 Mute";
    });

    btnMuteVideo.addEventListener("click", () => {
      if (!localStream) return;
      camDisabled = !camDisabled;
      localStream.getVideoTracks().forEach(t => (t.enabled = !camDisabled));
      localVideo.style.opacity = camDisabled ? "0.1" : "1";
    });

    // --- 5. Chat Auto-Scroll and Message Injection ---
    function appendMessage(sender, text, type = "stranger") {
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${type}`;

      if (type === "system") {
        msgDiv.textContent = text;
      } else {
        msgDiv.innerHTML = `<span class="time">${timeStr}</span><span class="sender">${sender}:</span> ${escapeHTML(text)}`;
        if (type === "stranger") playBeep(520, 0.08);
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- 6. Stranger Connection & Interaction Simulation ---
    function startSearching() {
      if (partnerAnimationTimer) cancelAnimationFrame(partnerAnimationTimer);
      clearTimeout(botDialogueTimeout);

      isSearching = true;
      isConnected = false;
      currentStranger = null;

      strangerDot.classList.remove("connected");
      strangerLabel.textContent = "Connecting...";
      strangerTag.style.display = "none";
      btnMainAction.textContent = "⏹ Stop";
      btnMainAction.classList.add("stop");

      chatInput.disabled = true;
      btnSendMessage.disabled = true;

      appendMessage("", "Looking for someone you can chat with...", "system");

      const ctx = strangerCanvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, strangerCanvas.width, strangerCanvas.height);

      setTimeout(() => {
        if (!isSearching) return;
        connectStranger();
      }, 1400);
    }

    function connectStranger() {
      isSearching = false;
      isConnected = true;

      currentStranger = strangerProfiles[Math.floor(Math.random() * strangerProfiles.length)];
      strangerDot.classList.add("connected");
      strangerLabel.textContent = currentStranger.name;
      strangerTag.textContent = `Matched on: ${currentStranger.tag}`;
      strangerTag.style.display = "block";
      btnMainAction.textContent = "⏹ Next (Esc)";

      chatInput.disabled = false;
      btnSendMessage.disabled = false;
      chatInput.focus();

      playBeep(880, 0.12);
      appendMessage("", "You're now chatting with a random stranger. Say hi!", "system");
      appendMessage("", `You both like ${currentStranger.tag}.`, "system");
      renderStrangerFrame();

      botDialogueTimeout = setTimeout(() => {
        if (!isConnected) return;
        const intros = ["Hey! How's your day going?", "Hello from the other side!", "What's up?", "Konnichiwa! Hey!"];
        appendMessage("Stranger", intros[Math.floor(Math.random() * intros.length)], "stranger");
      }, 1200);
    }

    function disconnectStranger() {
      if (partnerAnimationTimer) cancelAnimationFrame(partnerAnimationTimer);
      clearTimeout(botDialogueTimeout);

      isConnected = false;
      isSearching = false;
      currentStranger = null;

      strangerDot.classList.remove("connected");
      strangerLabel.textContent = "Disconnected";
      strangerTag.style.display = "none";

      btnMainAction.textContent = "▶ Start Chat";
      btnMainAction.classList.remove("stop");

      chatInput.disabled = true;
      btnSendMessage.disabled = true;

      playBeep(280, 0.15);
      appendMessage("", "You have disconnected.", "system");

      const ctx = strangerCanvas.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, strangerCanvas.width, strangerCanvas.height);
    }

    // Controls and Hotkey
    btnMainAction.addEventListener("click", () => {
      if (isConnected || isSearching) {
        disconnectStranger();
      } else {
        startSearching();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (isConnected || isSearching) {
          disconnectStranger();
          setTimeout(startSearching, 300);
        } else {
          startSearching();
        }
      }
    });

    // Chat Send
    function handleSend(customText = null) {
      const msg = customText || chatInput.value.trim();
      if (!msg || !isConnected) return;

      appendMessage("You", msg, "you");
      chatInput.value = "";

      clearTimeout(botDialogueTimeout);
      botDialogueTimeout = setTimeout(() => {
        if (!isConnected) return;
        const replies = [
          "That is so cool!",
          "Haha totally agree with you!",
          "Where are you chatting from?",
          "Just listening to some city pop and lofi beats 🎧",
          "Do you play any games or watch anime?",
          "Nice meeting you!",
          "Take care my friend!"
        ];
        appendMessage("Stranger", replies[Math.floor(Math.random() * replies.length)], "stranger");
      }, 1000 + Math.random() * 800);
    }

    btnSendMessage.addEventListener("click", () => handleSend());
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    // Quick Chips Click Event
    quickChips.forEach(chip => {
      chip.addEventListener("click", () => {
        if (!isConnected) return;
        const msg = chip.getAttribute("data-msg");
        handleSend(msg);
      });
    });
  </script>
</body>
</html>
