<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web TV 555 - Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body style="margin:0; padding:0; background:#07090e; color:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden;">

  <!-- Header -->
  <header style="height:56px; background:#0f172a; border-bottom:1px solid #1e293b; display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="font-size:1.2rem; font-weight:900; color:#fff;">⚡ Web TV <span style="background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; font-size:0.75rem; padding:2px 7px; border-radius:5px;">555</span></span>
      <span id="userCountBadge" style="font-size:0.78rem; color:#94a3b8; background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:20px; border:1px solid #1e293b;">🟢 <span id="userCount">1</span> Online</span>
      <span id="p2pStatus" style="font-size:0.78rem; color:#f59e0b; background:rgba(255,255,255,0.05); padding:4px 10px; border-radius:20px; border:1px solid #1e293b;">Connecting...</span>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button id="btnOpenSettings" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; padding:7px 12px; border-radius:8px; font-weight:700; font-size:0.8rem; cursor:pointer;">⚙️ Settings</button>
      <button id="btnToggleHardware" style="background:#10b981; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:800; font-size:0.82rem; cursor:pointer;">📹 Enable Cam &amp; Mic</button>
    </div>
  </header>

  <!-- Settings Modal (Popup) -->
  <div id="settingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:#0f172a; border:1px solid #334155; border-radius:14px; padding:20px; width:90%; max-width:400px; display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:8px;">
        <span style="font-weight:800;">⚙️️ Studio Settings</span>
        <button id="btnCloseSettings" style="background:none; border:none; color:#94a3b8; font-size:1.4rem; cursor:pointer;">&times;</button>
      </div>
      <div>
        <label style="font-size:0.75rem; color:#94a3b8; font-weight:700;">Camera Visual Filter</label>
        <select id="filterSelect" style="width:100%; background:#1e293b; color:#fff; border:1px solid #334155; padding:8px; border-radius:6px; margin-top:4px;">
          <option value="none">Normal</option>
          <option value="grayscale(100%)">Black &amp; White</option>
          <option value="sepia(80%)">Retro</option>
          <option value="contrast(140%)">High Contrast</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.75rem; color:#94a3b8; font-weight:700;">Vibe</label>
        <select id="vibeSelect" style="width:100%; background:#1e293b; color:#fff; border:1px solid #334155; padding:8px; border-radius:6px; margin-top:4px;">
          <option value="☕ Chill">☕ Chill</option>
          <option value="🎮 Gaming">🎮 Gaming</option>
          <option value="🎧 Jamming">🎧 Jamming</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Workspace Split -->
  <main style="flex:1; display:flex; padding:10px; gap:10px; overflow:hidden; min-height:0;">
    <!-- Stage Area -->
    <div style="flex:7; position:relative; background:#000; border-radius:12px; border:1px solid #1e293b; overflow:hidden; display:flex; align-items:center; justify-content:center;">
      <span id="strangerLabel" style="position:absolute; top:12px; left:12px; background:rgba(15,23,42,0.85); padding:6px 14px; border-radius:20px; font-size:0.8rem; font-weight:700; border:1px solid #334155; z-index:10;">🔴 Disconnected</span>
      
      <video id="remoteVideo" autoplay playsinline style="width:100%; height:100%; object-fit:cover; display:none;"></video>
      <canvas id="remoteCanvas" style="width:100%; height:100%; display:block;"></canvas>

      <!-- Local PiP -->
      <div style="position:absolute; bottom:14px; right:14px; width:180px; height:130px; background:#0f172a; border:2px solid #3b82f6; border-radius:10px; overflow:hidden; z-index:20;">
        <span style="position:absolute; top:4px; left:6px; font-size:0.68rem; font-weight:700; background:rgba(0,0,0,0.7); padding:2px 6px; border-radius:4px; z-index:2;">You</span>
        <video id="localVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover; display:none; transform:scaleX(-1);"></video>
        <canvas id="localCanvas" style="width:100%; height:100%; display:block;"></canvas>
      </div>
    </div>

    <!-- Chat Column -->
    <aside style="flex:3; min-width:300px; max-width:380px; background:#0f172a; border-radius:12px; border:1px solid #1e293b; display:flex; flex-direction:column; overflow:hidden;">
      <div style="padding:10px 14px; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:800; font-size:0.9rem;">💬 Live Chat</span>
        <button id="btnOpenGames" style="background:#1e293b; border:1px solid #334155; color:#34d399; font-weight:700; font-size:0.75rem; padding:4px 8px; border-radius:6px; cursor:pointer;">🎮 Games ▾</button>
      </div>

      <!-- Quick Games Tray -->
      <div id="gamesTray" style="display:none; padding:8px 12px; background:#0b1120; border-bottom:1px solid #1e293b; gap:6px;">
        <button id="btnTod" style="background:#1e293b; color:#fbbf24; border:1px solid #334155; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">🎡 T or D</button>
        <button id="btnWyr" style="background:#1e293b; color:#f472b6; border:1px solid #334155; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;">🤔 WYR</button>
      </div>

      <div id="chatContainer" style="flex:1; padding:12px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;">
        <div style="font-size:0.8rem; color:#64748b; font-style:italic; text-align:center;">Click Start Chat to connect with someone.</div>
      </div>

      <div style="padding:10px; border-top:1px solid #1e293b; display:flex; gap:6px; background:#0b1120;">
        <input type="text" id="chatInput" placeholder="Type message..." disabled style="flex:1; background:#07090e; border:1px solid #1e293b; padding:8px 10px; color:#fff; border-radius:6px; outline:none; font-size:0.85rem;" />
        <button id="btnSendMessage" disabled style="background:#3b82f6; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-weight:700; cursor:pointer;">Send</button>
      </div>
    </aside>
  </main>

  <!-- Controls Deck Footer -->
  <footer style="height:60px; background:#0f172a; border-top:1px solid #1e293b; display:flex; align-items:center; padding:0 16px; gap:10px; flex-shrink:0;">
    <button id="btnMainAction" style="background:#3b82f6; color:#fff; border:none; padding:10px 22px; border-radius:7px; font-weight:800; font-size:0.95rem; cursor:pointer;">▶ Start Chat</button>
    <button id="btnNextStranger" style="display:none; background:#e11d48; color:#fff; border:none; padding:10px 16px; border-radius:7px; font-weight:800; font-size:0.9rem; cursor:pointer;">⏭ Next (Esc)</button>
    
    <div style="display:flex; align-items:center; gap:6px; background:#07090e; border:1px solid #1e293b; padding:5px 10px; border-radius:7px;">
      <span style="font-size:0.76rem; color:#64748b; font-weight:700;">I am:</span>
      <select id="myGenderSelect" style="background:transparent; border:none; color:#fff; font-size:0.8rem; outline:none;">
        <option value="male" style="background:#0f172a;">👨 Male</option>
        <option value="female" style="background:#0f172a;">👩 Female</option>
      </select>
    </div>

    <div style="display:flex; align-items:center; gap:6px; background:#07090e; border:1px solid #1e293b; padding:5px 10px; border-radius:7px;">
      <span style="font-size:0.76rem; color:#64748b; font-weight:700;">Match:</span>
      <select id="genderSelect" style="background:transparent; border:none; color:#fff; font-size:0.8rem; outline:none;">
        <option value="both" style="background:#0f172a;">👥 Anyone</option>
        <option value="female" style="background:#0f172a;">👩 Female</option>
        <option value="male" style="background:#0f172a;">👨 Male</option>
      </select>
    </div>
  </footer>

  <script>
    // Embedded minimal verified script
    const socket = io("https://my-web-chat-production.up.railway.app", { transports: ["websocket", "polling"] });
    let peer = new Peer({ config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] } });
    let myPeerId = null, localStream = null, activeCall = null, activeDataConnection = null, isConnected = false;

    // Settings Toggle
    const settingsModal = document.getElementById("settingsModal");
    document.getElementById("btnOpenSettings").onclick = () => settingsModal.style.display = "flex";
    document.getElementById("btnCloseSettings").onclick = () => settingsModal.style.display = "none";
    settingsModal.onclick = (e) => { if (e.target === settingsModal) settingsModal.style.display = "none"; };

    // Games Tray Toggle
    const gamesTray = document.getElementById("gamesTray");
    document.getElementById("btnOpenGames").onclick = () => {
      gamesTray.style.display = gamesTray.style.display === "flex" ? "none" : "flex";
    };

    // Filter Change
    document.getElementById("filterSelect").onchange = (e) => {
      document.getElementById("localVideo").style.filter = e.target.value;
    };

    // Server Status
    socket.on("connect", () => {
      document.getElementById("p2pStatus").textContent = "🟢 Server Ready";
      document.getElementById("p2pStatus").style.color = "#10b981";
    });
    socket.on("presence_count", (cnt) => {
      document.getElementById("userCount").textContent = cnt;
    });

    peer.on("open", (id) => { myPeerId = id; });

    // Enable Hardware
    document.getElementById("btnToggleHardware").onclick = async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const v = document.getElementById("localVideo");
        v.srcObject = localStream;
        v.style.display = "block";
        document.getElementById("localCanvas").style.display = "none";
        document.getElementById("btnToggleHardware").textContent = "✔ Cam Active";
      } catch (err) {
        alert("Camera permission denied or camera not found.");
      }
    };

    // Matchmaking
    const btnMain = document.getElementById("btnMainAction");
    btnMain.onclick = () => {
      if (isConnected) {
        if (activeCall) activeCall.close();
        socket.emit("leave_queue");
        isConnected = false;
        btnMain.textContent = "▶ Start Chat";
        document.getElementById("strangerLabel").textContent = "🔴 Disconnected";
      } else {
        btnMain.textContent = "⏹ Cancel";
        document.getElementById("strangerLabel").textContent = "🟡 Searching...";
        socket.emit("join_queue", {
          peerId: myPeerId,
          gender: document.getElementById("myGenderSelect").value,
          matchPref: document.getElementById("genderSelect").value,
          tags: ["chatting"]
        });
      }
    };

    socket.on("matched", (data) => {
      isConnected = true;
      btnMain.textContent = "⏹ Stop";
      document.getElementById("btnNextStranger").style.display = "inline-block";
      document.getElementById("strangerLabel").textContent = "🟢 Connected";
      document.getElementById("chatInput").disabled = false;
      document.getElementById("btnSendMessage").disabled = false;

      if (data.isInitiator && localStream) {
        const call = peer.call(data.partnerPeerId, localStream);
        call.on("stream", (s) => {
          const rv = document.getElementById("remoteVideo");
          rv.srcObject = s;
          rv.style.display = "block";
          document.getElementById("remoteCanvas").style.display = "none";
        });
      }
    });

    peer.on("call", (call) => {
      if (localStream) {
        call.answer(localStream);
        call.on("stream", (s) => {
          const rv = document.getElementById("remoteVideo");
          rv.srcObject = s;
          rv.style.display = "block";
          document.getElementById("remoteCanvas").style.display = "none";
        });
      }
    });

    // Chat
    document.getElementById("btnSendMessage").onclick = () => {
      const inp = document.getElementById("chatInput");
      if (!inp.value.trim()) return;
      const d = document.createElement("div");
      d.style.cssText = "font-size:0.85rem; color:#38bdf8; font-weight:700;";
      d.textContent = "You: " + inp.value;
      document.getElementById("chatContainer").appendChild(d);
      inp.value = "";
    };
  </script>
</body>
</html>
