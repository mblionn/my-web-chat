<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Web TV 555 - Live Random Video Chat</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="brand-group">
      <div class="logo">Web TV <span class="logo-badge">555</span></div>
      <div class="online-counter-badge"><span class="online-dot"></span><span id="userCount">1</span> online</div>
      <div class="streak-badge" id="streakBadge">⚡ <span id="strangersMetCount">0</span> Met</div>
      <div class="server-status-badge">
        <span class="online-dot" id="serverDot" style="background:#f59e0b; box-shadow:0 0 6px #f59e0b;"></span>
        <span id="p2pStatus" style="font-weight:700; color:#f59e0b;">Server: Connecting...</span>
      </div>
    </div>
    
    <div class="header-actions">
      <select id="vibeSelect" class="header-select">
        <option value="☕ Chill">☕ Chill</option>
        <option value="🎧 Jamming">🎧 Jamming</option>
        <option value="🎮 Gaming">🎮 Gaming</option>
      </select>
      <select id="voiceFxSelect" class="header-select">
        <option value="normal">🎙 Normal Voice</option>
        <option value="deep">👹 Deep Demon</option>
        <option value="telephone">📻 Radio Walkie</option>
      </select>
      <select id="filterSelect" class="header-select">
        <option value="none">✨ Normal</option>
        <option value="grayscale(100%)">Noir (B&W)</option>
        <option value="sepia(60%) contrast(110%)">Warm Vintage</option>
      </select>
      <button class="tool-header-btn" id="btnToggleStudioGlow">💡 Glow</button>
      <button class="tool-header-btn" id="btnToggleSound">🔊 Sound ON</button>
      <button class="cam-btn" id="btnToggleHardware">📹 Enable Camera & Mic</button>
    </div>
  </header>

  <!-- Viewports -->
  <main>
    <div class="stage-column" id="stageColumn">
      <div class="video-stage-container" id="videoStageContainer">
        <div class="remote-video-wrap">
          <div class="video-badge">
            <span class="badge-dot" id="strangerDot"></span>
            <span id="strangerLabel">Disconnected</span>
          </div>
          <video id="remoteVideo" autoplay playsinline></video>
          <canvas id="remoteCanvas"></canvas>
        </div>

        <div class="local-pip-card" id="localPipCard">
          <div class="local-pip-badge" id="localLabel"><span>You</span></div>
          <video id="localVideo" class="mirrored" autoplay playsinline muted></video>
          <canvas id="localCanvas"></canvas>
        </div>
      </div>
    </div>

    <!-- Chat Drawer -->
    <div class="chat-section">
      <div class="chat-header">
        <div class="chat-header-title">
          <span>💬 Text Conversation</span>
          <span class="typing-label" id="typingIndicator">Stranger is typing...</span>
        </div>
        <div class="header-chat-actions">
          <div class="games-dropdown-wrap">
            <button id="btnGamesMenu" class="chat-tool-btn game-btn">🎮 Games ▾</button>
            <div class="games-menu" id="gamesMenu">
              <button class="game-item-btn" id="mGameTTT">🎮 Tic-Tac-Toe</button>
              <button class="game-item-btn" id="mGameWYR">🤔 Would You Rather</button>
              <button class="game-item-btn" id="mGameTOD">🎡 Truth or Dare</button>
              <button class="game-item-btn" id="mGameTrivia">🧠 Trivia Duel</button>
            </div>
          </div>
          <button id="btnSnapshot" class="chat-tool-btn">📸 Snap</button>
        </div>
      </div>

      <div class="messages-container" id="chatContainer">
        <div class="message system">Welcome to Web TV 555! Click Start Chat to connect.</div>
      </div>

      <div class="quick-replies">
        <button class="quick-chip" id="btnCoinFlip">🪙 Flip Coin</button>
        <button class="quick-chip" id="btnDiceRoll">🎲 Roll D6</button>
      </div>

      <div class="chat-input-area">
        <input type="file" id="chatImageInput" accept="image/*" style="display:none;" />
        <button class="btn-icon-file" id="btnAttachImage" disabled>📷</button>
        <input type="text" id="chatInput" placeholder="Type a message..." disabled autocomplete="off" />
        <button class="send-btn" id="btnSendMessage" disabled>Send</button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <button class="btn-main-action" id="btnMainAction">▶ Start Chat</button>
    <button class="btn-main-action" id="btnNextStranger" style="background:#e11d48; display:none;">⏭ Next</button>

    <div class="gender-picker-wrap">
      <label for="myGenderSelect">I am:</label>
      <select id="myGenderSelect" class="gender-select">
        <option value="male">👨 Male</option>
        <option value="female">👩 Female</option>
      </select>
    </div>

    <div class="gender-picker-wrap">
      <label for="genderSelect">Match With:</label>
      <select id="genderSelect" class="gender-select">
        <option value="both">👥 Both / Random</option>
        <option value="female">👩 Female Only</option>
        <option value="male">👨 Male Only</option>
      </select>
    </div>

    <div class="interests-container">
      <div id="tagsList"></div>
      <input type="text" id="tagInput" class="tag-input" placeholder="+ Add topic..." />
      <button class="btn-add-tag" id="btnAddTag">+ Add</button>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="main.js"></script>
</body>
</html>
